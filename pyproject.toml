[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvr-radar"
version = "0.1.0"
description = "Opdager nyregistrerede danske virksomheder via CVR og sender Telegram-notifikationer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
cvr-radar = "cvr_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
